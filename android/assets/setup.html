<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Local</title>
<style>
  :root { --bg: #0b0d12; --panel: #151922; --text: #eef1f7; --muted: #8f98ab; --accent: #ffb020; }
  * { box-sizing: border-box; }
  html { font-size: clamp(14px, 1.9vw, 30px); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  .box { width: min(34rem, 92vw); text-align: center; }
  .logo { width: 4rem; height: 4rem; border-radius: 50%; background: var(--accent); margin: 0 auto 1.2rem; display: grid; place-items: center; }
  .logo::after { content: ''; border-left: 1.3rem solid var(--bg); border-top: .8rem solid transparent; border-bottom: .8rem solid transparent; margin-left: .35rem; }
  h1 { margin: 0 0 .4rem; font-size: 1.8rem; }
  p { color: var(--muted); margin: 0 0 1.4rem; line-height: 1.45; }
  .spin { width: 2.6rem; height: 2.6rem; margin: 1rem auto; border-radius: 50%; border: .3rem solid #ffffff30; border-top-color: var(--accent); animation: r .9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  input { width: 100%; font: inherit; font-size: 1.2rem; padding: .8rem 1rem; border-radius: .7rem; border: 2px solid #ffffff30; background: var(--panel); color: var(--text); text-align: center; }
  input:focus { border-color: var(--accent); outline: none; }
  .btns { display: flex; gap: .8rem; justify-content: center; margin-top: 1rem; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: .8rem 1.6rem; background: #ffffff1c; color: var(--text); }
  button.primary { background: var(--accent); color: var(--bg); }
  button:focus { outline: 3px solid #fff; outline-offset: 3px; }
  .hint { font-size: .85rem; margin-top: 1.6rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"></div>
  <h1>Player Local</h1>
  <div id="searching">
    <p>Procurando o servidor na rede…</p>
    <div class="spin"></div>
  </div>
  <div id="form" hidden>
    <p id="msg"></p>
    <input id="url" inputmode="url" placeholder="Ex.: 192.168.0.10:8765" autocomplete="off" spellcheck="false">
    <div class="btns">
      <button class="primary" id="connect">Conectar</button>
      <button id="retry">Procurar de novo</button>
    </div>
    <p class="hint">Confira se o Player Local está aberto no PC (iniciar.bat) e se o PC e a TV estão na mesma rede.
      O endereço aparece na linha “Na rede” da janela do servidor.</p>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const state = q.get('state') || 'searching';
  const $ = id => document.getElementById(id);
  if (state === 'searching') {
    $('searching').hidden = false; $('form').hidden = true;
  } else {
    $('searching').hidden = true; $('form').hidden = false;
    $('msg').textContent = q.get('msg') || 'Informe o endereço do servidor.';
    $('url').value = (q.get('url') || '').replace(/^https?:\/\//, '');
    $('connect').focus();
  }
  const bridge = window.PlayerLocalApp;
  $('connect').onclick = () => bridge && bridge.connect($('url').value);
  $('retry').onclick = () => bridge && bridge.retry();
  $('url').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('connect').click(); } });
  // navegação simples por setas entre os 3 controles
  const order = ['url', 'connect', 'retry'];
  document.addEventListener('keydown', e => {
    if ($('form').hidden) return;
    const i = order.indexOf(document.activeElement && document.activeElement.id);
    if (e.key === 'ArrowDown' && i === 0) { e.preventDefault(); $('connect').focus(); }
    else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); $('url').focus(); }
    else if (e.key === 'ArrowRight' && i === 1) { e.preventDefault(); $('retry').focus(); }
    else if (e.key === 'ArrowLeft' && i === 2) { e.preventDefault(); $('connect').focus(); }
    else if (i < 0) { $('connect').focus(); }
  });
</script>
</body>
</html>
